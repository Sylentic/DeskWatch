[package]
name = "deskwatch-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
embedded-graphics = "0.8.2"
heapless = { version = "0.9.3", features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde-json-core = "0.7.0"
u8g2-fonts = { version = "0.8.0", features = ["embedded_graphics_textstyle"] }

[dev-dependencies]
embedded-graphics-simulator = { version = "0.8.0", default-features = false }
