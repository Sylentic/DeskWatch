# DeskWatch dashboard in Docker: the full-size status page, served by the
# bridge, opened in any browser. No MQTT broker and no ESP needed.
# Guide: docs/docker.md (section 3)
#
#   git clone https://github.com/Sylentic/DeskWatch.git && cd DeskWatch
#   mkdir -p dashboard/credentials
#   cp deploy/dashboard.example.toml dashboard/bridge.toml        # then edit it
#   openssl rand -hex 24 > dashboard/credentials/kiosk-token      # the page token
#   chmod 644 dashboard/credentials/kiosk-token                   # readable by uid 10001
#   docker compose -f deploy/docker-compose.dashboard.yml up -d --build
#   # then open http://<docker host>:8787/?token=<the token>
#
# Paths below are relative to this file. To use it from another folder, copy it
# there and change `build.context` to the repository root (or a git URL).

services:
  deskwatch:
    build:
      context: ..
    image: deskwatch-bridge:local
    container_name: deskwatch
    restart: unless-stopped

    volumes:
      # The config and one file per secret, both read-only.
      - ../dashboard/bridge.toml:/etc/deskwatch/bridge.toml:ro
      - ../dashboard/credentials:/run/credentials:ro

    # The page. "8787:8787" is reachable from your whole network, so keep
    # `token_file` set. Behind a reverse proxy on the same host, publish
    # "127.0.0.1:8787:8787" instead and let only the proxy reach it.
    ports:
      - "8787:8787"

    # Hardening: the bridge writes nothing to disk and needs no privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    # The image's HEALTHCHECK reads this config and asks the page for `/`
    # (the page file has no data and needs no token). `docker ps` shows
    # "healthy" or "unhealthy".
