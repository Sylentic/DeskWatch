<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DeskWatch</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="kiosk.css">
</head>
<body>
<header id="top">
  <div class="hl">
    <div class="brand">DeskWatch</div>
    <div id="badges" class="badges"></div>
  </div>
  <div class="hr">
  <div id="banner" class="banner" role="status" hidden></div>
  <button type="button" id="alert-pill" class="banner pill" aria-live="polite" title="Show the alerts" hidden></button>
  <div id="src-pill" class="banner pill warn" role="status" hidden></div>
  <span id="update-chip" class="chip update" hidden><a id="update-link" href="#" target="_blank" rel="noopener noreferrer"></a><button type="button" id="update-x" aria-label="Hide this notice" title="Hide until the next version">&times;</button></span>
  <button type="button" id="edit-btn" class="edit-btn icon-btn" title="Customize the dashboard" aria-label="Customize the dashboard"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></button>
  <a id="setup-link" class="setup-link icon-btn" href="setup" title="Setup" aria-label="Setup" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  <div class="clock"><div id="time">--:--</div><div id="date"></div></div>
  </div>
  <div id="progress" class="topbar" hidden><i></i></div>
</header>
<nav id="rail" class="rail" aria-label="Sources">
  <span class="label">SOURCES</span>
  <span id="sources"></span>
  <a id="conn" class="chip end">connecting</a>
</nav>
<div id="alerts-pop" class="failed-pop" role="dialog" aria-label="Alerts" hidden></div>
<div id="failed-pop" class="failed-pop" role="dialog" aria-label="Failed runs" hidden></div>
<div id="offline" class="offline" hidden></div>
<div id="notice" class="notice" role="status" hidden></div>
<div id="edit-bar" class="edit-bar" hidden></div>
<main id="grid" class="grid"></main>
<script src="kiosk.js"></script>
</body>
</html>
