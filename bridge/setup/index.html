<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DeskWatch setup</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="setup.css">
</head>
<body>
<header>
  <h1>DeskWatch<span class="where">/ setup</span></h1>
  <span id="build" class="muted"></span>
  <a id="dashboard-link" href="./" hidden>Dashboard</a>
  <button id="signout" type="button" class="secondary theme" hidden title="Sign out of DeskWatch">Sign out</button>
  <button id="theme" type="button" class="secondary theme" title="Switch between dark and light">Light mode</button>
</header>
<main id="app" aria-live="polite">
  <p class="muted">Loading…</p>
</main>
<script src="setup.js"></script>
</body>
</html>
