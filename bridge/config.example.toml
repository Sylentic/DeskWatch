# DeskWatch bridge config example.
#
# Copy to /etc/deskwatch/bridge.toml (Linux) or
# C:\ProgramData\DeskWatch\bridge.toml (Windows) and adjust. Every key is
# optional; the values below are the defaults unless noted. Never put
# passwords or tokens in this file. Keys ending in `_file` name a credential:
# a plain name is read from systemd's credentials folder (LoadCredential= in
# deploy/deskwatch-bridge.service) or, on Windows, from
# C:\ProgramData\DeskWatch\credentials; an absolute path is read as is.
# On Windows write paths in single quotes or with forward slashes.

[mqtt]
host = "localhost"              # Mosquitto broker, usually on the same server
port = 1883
client_id = "deskwatch-bridge"
# Broker login. Needed once the broker turns anonymous access off; see
# docs/mosquitto.md. The username is the one in the broker's password file.
# username = "deskwatch-bridge"
# password_file = "mqtt-password" # else the DESKWATCH_MQTT_PASSWORD env var
# TLS (usually port 8883). Without ca_file the system's trusted roots are used.
# tls = true
# ca_file = "/etc/deskwatch/mqtt-ca.pem"        # only for a private CA
# client_cert_file = "/etc/deskwatch/client.pem" # only if the broker demands one
# client_key_file = "mqtt-client-key"           # credential holding the key
topic_prefix = "deskpanel"      # matches the schema, change only for testing
keep_alive_s = 30

[server]
# display_name = "homeserver"   # name on the stats page, defaults to the hostname
interval_s = 5                  # stats sample and publish interval
# net_iface = "eth0"            # defaults to the busiest non-loopback interface
disk_path = "/"                 # filesystem for disk_pct (local stats are Linux only)

# Shared listener for webhooks. Only opened when a source needs it.
[http]
listen = "0.0.0.0:8787"

# Data sources. Each type is an array, so there can be several of each; the
# name must be unique per type. Remove a block to switch that source off.

# Gitea Actions and pull requests. Webhook setup is in docs/install.md; the
# webhook URL is http://<this host>:8787/webhook/gitea/<name>.
[[source.gitea]]
name = "home"                   # required: used in the webhook URL and logs
base_url = "https://gitea.example.com"  # required: your Gitea address
webhook_secret_file = "gitea-webhook-secret"  # required: same value as in Gitea
# token_file = "gitea-token"    # optional read-only token, for private repos
repos = ["owner/repo"]          # repos whose open PRs are polled for the header badge
poll_s = 60                     # open PR poll, a safety net behind PR webhooks
job_poll_s = 5                  # step progress poll while a job runs
interrupt = true                # true, false, or a list such as ["owner/repo"]
# alias = { "owner/repo" = "shop" }  # short labels on the panel

# Alerts that Home Assistant or any script publishes on <topic_prefix>/alert.
# Severity info flashes a notice, warning shows an amber screen, critical a
# red screen above running jobs. The button takes an alert off the screen; it
# stays in the header badge and on the alerts page until cleared.
[alerts]
enabled = true
max_active = 10                 # least urgent, oldest alert is dropped first
# critical_ids = ["leak", "smoke"]  # only these ids may be critical, others become warnings

# Host stats and container health from a Prometheus server that scrapes
# node_exporter (and cAdvisor). Each host gets its own page: add
# `stats:<name>` to the rotation below. The built-in `stats` page (the
# bridge's own machine, read from /proc) keeps working without Prometheus.
# [[source.prometheus]]
# name = "home"                 # required: used in logs
# url = "http://prometheus.example.lan:9090"  # required
# # token_file = "prometheus-token"  # optional bearer token, for a proxy in front
# interval_s = 5                # seconds between queries
# disk_mountpoint = "/"         # filesystem shown as disk usage
# # net_device = "eth0"         # default: the busiest real network device
# hosts = [
#   # The node_exporter `instance` label alone, or a table. `name` is the page
#   # name and shown host name (defaults to the instance without its port).
#   # With `cadvisor` (that machine's cAdvisor instance) and
#   # `expect_containers`, a container that stopped shows on the `containers`
#   # page and in the `server` badge.
#   { instance = "node-exporter:9100", name = "home", cadvisor = "cadvisor:8080", expect_containers = ["gitea", "mosquitto"] },
#   "nas.example.lan:9100",
# ]
# # Replace the PromQL of a field; it must return one value per `instance`.
# # Fields: cpu_pct, cpu_temp_c, cpu_count, ram_pct, disk_pct, uptime_s.
# # queries = { cpu_temp_c = 'max by (instance) (node_thermal_zone_temp)' }

# GitHub, GitHub Enterprise Server or GHE.com: open PRs and Actions runs, by
# polling (GitHub cannot reach your server, so no webhook). Setup is in the
# docs/install.md. Uncomment and adjust; add one block per account or instance.
# [[source.github]]
# name = "personal"             # required: used in logs
# base_url = "https://api.github.com"  # default; GHES: https://ghe.example.com/api/v3
# token_file = "github-personal" # required: read-only fine-grained token
# repos = ["your-user/repo-a"]  # required: repos to watch
# poll_s = 60                   # open PRs and recent runs, with ETags
# job_poll_s = 5                # step progress while a run is in progress
# interrupt = true              # true, false, or a list such as ["your-user/repo-a"]
# notify_new_prs = true         # flash "New PR" for new non-draft PRs
# alias = { "your-user/repo-a" = "A" }  # short labels on the panel
#
# [[source.github]]
# name = "work"
# base_url = "https://ghe.example.com/api/v3"
# token_file = "github-work"
# repos = ["team/service-a"]
# interrupt = false             # work runs only in the badge and pipelines page
# alias = { "team/service-a" = "service A" }

# Azure DevOps Services: pipeline runs and open PRs, by polling with a read-only
# personal access token. Terraform pipelines show their stage and task
# ("apply: terraform apply"), and a stage waiting for an approval raises an
# "Approval needed" notice. Setup and the scopes to grant are in
# docs/azure-devops.md. Uncomment and adjust; add one block per organisation.
# [[source.azure_devops]]
# name = "work"                 # required: used in logs
# organization = "your-org"     # required: dev.azure.com/<organization>
# projects = ["project-a"]      # required: projects to watch
# token_file = "azdo-work"      # required: read-only PAT (Build: Read, Code: Read)
# poll_s = 60                   # builds, approvals and open PRs
# job_poll_s = 5                # step progress while a build may take over the screen
# interrupt = false             # default; true, or a list such as ["project-a"]
# pull_requests = true          # count open PRs (needs Code: Read)
# notify_new_prs = true         # flash "New PR" for new non-draft PRs
# deploy_words = ["deploy", "terraform"]  # pipeline names with these are deploys
# alias = { "project-a" = "infra", "project-a/repo-a" = "A" }  # short labels

# Idle pages, in order. Pages with nothing to show are skipped when
# skip_when_empty is set. "stats" is the bridge's own machine, "prs" lists open PRs and "pipelines" the latest run
# of each pipeline, from every CI source. "alerts" lists active alerts. With a
# Prometheus source, add "stats:<host>" for each host and "containers" for what
# is down.
[[rotation]]
page = "stats"
dwell_s = 20

[[rotation]]
page = "prs"
dwell_s = 8
skip_when_empty = true

[[rotation]]
page = "pipelines"
dwell_s = 10
skip_when_empty = true

[[rotation]]
page = "alerts"
dwell_s = 8
skip_when_empty = true

