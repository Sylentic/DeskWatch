# DeskWatch bridge config example.
#
# Copy to /etc/deskwatch/bridge.toml (Linux) or
# C:\ProgramData\DeskWatch\bridge.toml (Windows) and adjust. Every key is
# optional; the values below are the defaults unless noted. Never put
# passwords or tokens in this file. Keys ending in `_file` name a credential:
# a plain name is read from systemd's credentials folder (LoadCredential= in
# deploy/deskwatch-bridge.service) or, on Windows, from
# C:\ProgramData\DeskWatch\credentials; an absolute path is read as is.
# On Windows write paths in single quotes or with forward slashes.

[mqtt]
# enabled = false              # no broker at all: a bridge that only serves the kiosk page (docs/docker.md)
host = "localhost"              # Mosquitto broker, usually on the same server
port = 1883
client_id = "deskwatch-bridge"
# Broker login. Needed once the broker turns anonymous access off; see
# docs/mosquitto.md. The username is the one in the broker's password file.
# username = "deskwatch-bridge"
# password_file = "mqtt-password" # else the DESKWATCH_MQTT_PASSWORD env var
# TLS (usually port 8883). Without ca_file the system's trusted roots are used.
# tls = true
# ca_file = "/etc/deskwatch/mqtt-ca.pem"        # only for a private CA
# client_cert_file = "/etc/deskwatch/client.pem" # only if the broker demands one
# client_key_file = "mqtt-client-key"           # credential holding the key
topic_prefix = "deskpanel"      # matches the schema, change only for testing
keep_alive_s = 30

# Shared listener for the Gitea webhook, the kiosk page, the setup page and the
# Docker health check (/healthz, whenever MQTT is on). It stays closed only when
# none of those is in use.
[http]
listen = "0.0.0.0:8787"

# HTTPS for the kiosk page, the setup page, /api/alert and the live WebSocket.
# Off by default (plain HTTP). With it the listener speaks HTTPS only, on the
# same port. Both files are PEM. Guide: docs/https.md
# [http.tls]
# cert = "/etc/deskwatch/tls/dashboard.crt"
# key = "/etc/deskwatch/tls/dashboard.key"

# A writable folder where the bridge keeps sources.toml (more [[source.*]] blocks)
# and credentials/ (secrets written by it). Off by default. Guide: docs/data-dir.md
# [data]
# dir = "/var/lib/deskwatch"    # or the DESKWATCH_DATA_DIR environment variable

# The setup page (/setup): shows sources, credentials (never their values), the
# broker and live source health, and (with a data folder) adds, changes and
# removes sources and changes the broker settings. Off by default. It has NO
# login until you set an administrator password (docs/auth.md): trusted network
# only until then, never exposed to the internet. Guide: docs/setup-page.md
# [setup]
# enabled = true
# allow_restart = true          # a "Restart now" button; only when Docker or systemd starts the bridge again

# The login (docs/auth.md). A new install (an empty data folder) opens on a page
# that asks for the first account. Set required = false to keep a new install
# open until someone sets a password, for example a kiosk that needs nothing
# typed on first boot.
# [auth]
# required = false

# Dashboard page for a big screen (a Raspberry Pi with a monitor, a wall
# tablet): all stats, jobs, PRs, pipelines and alerts at once, served on the
# [http] listener above. Off by default. Guide: docs/kiosk.md
# [kiosk]
# enabled = true
# columns = 4                   # grid size, 1 to 12 each
# rows = 3
# # max_ws_clients = 16         # live-update WebSockets at once; further tabs poll instead
# # theme = "day"               # day (default), night (dimmer) or auto (night between the two times below)
# # night_from = "22:00"        # auto only; the browser's clock, may cross midnight
# # night_to = "07:00"
# # pixel_shift = false         # OLED: move the page a few pixels every pixel_shift_minutes
# # pixel_shift_minutes = 5
#
# # Widgets, left to right and top to bottom. Without any, a default layout is used.
# # Widgets: stats, hosts, jobs, prs, pipelines, alerts, containers, health, runners
# # (runners is not in the default layout and needs a source with `runners` set).
# [[kiosk.panel]]
# widget = "stats"
# # host = "home"               # stats only: which host, default the first
#
# [[kiosk.panel]]
# widget = "jobs"
# span = [2, 1]                 # grid cells covered: [columns, rows]
#
# [[kiosk.panel]]
# widget = "prs"
# span = [1, 2]
# # rows = 12                   # most list rows to show; default: as many as fit
# # title = "Reviews"
#
# [[kiosk.panel]]
# widget = "pipelines"          # jobs, prs and pipelines can be filtered:
# # source = "github"           # gitea, github, gitlab, bitbucket or azure_devops
# # repo = "acme/*"             # one repository, or a prefix ending in *; case does not matter

# Data sources. Each type is an array, so there can be several of each; the
# name must be unique per type. Remove a block to switch that source off.

# Gitea Actions and pull requests. Webhook setup is in docs/install.md; the
# webhook URL is http://<this host>:8787/webhook/gitea/<name>.
[[source.gitea]]
name = "home"                   # required: used in the webhook URL and logs
base_url = "https://gitea.example.com"  # required: your Gitea address
webhook_secret_file = "gitea-webhook-secret"  # required: same value as in Gitea
# token_file = "gitea-token"    # optional read-only token, for private repos
repos = ["owner/repo"]          # repos whose open PRs are polled for the header badge
poll_s = 60                     # open PR poll, a safety net behind PR webhooks
job_poll_s = 5                  # step progress poll while a job runs
interrupt = true                # true, false, or a list such as ["owner/repo"]
# alias = { "owner/repo" = "shop" }  # short labels on the kiosk page
# alert_new_issues = true       # new issues in the alerts list (tick "Issues" in the webhook)
# Runners for the kiosk `runners` widget (docs/runners.md). Off unless listed.
# Needs a token: "user" = runners of the token's user, "org:<name>", "repo:<owner>/<name>",
# "admin" = all runners (administrator token). Do not list overlapping scopes.
# runners = ["user"]
# runner_poll_s = 30            # seconds between runner polls

# Once a day, look on GitHub for a newer release and show a small notice. Only the
# version number is compared, nothing about this install is sent. false: never look.
[updates]
check = true

# Alerts that Home Assistant or any script publishes on <topic_prefix>/alert.
# Severity info is blue, warning yellow and critical red (critical goes above
# running jobs). Dismiss takes an alert off the dashboard for every screen.
[alerts]
enabled = true
max_active = 10                 # 1 to 50; least urgent, oldest alert is dropped first
# ticker = true                 # show the latest alert as a pill in the kiosk header
# ticker_speed = "normal"       # no longer used (the header has no moving text)
# show_source = true            # "via homeassistant" behind the alert in the header
# dismiss = true                # Dismiss buttons in the Alerts menu clear an alert for every screen
# http_input = false            # accept alerts as POST /api/alert (same JSON as MQTT); LAN only, or an alert key once a login is set (docs/auth.md)
# critical_ids = ["leak", "smoke"]  # only these ids may be critical, others become warnings

# Host stats and container health from a Prometheus server that scrapes
# node_exporter or windows_exporter (and cAdvisor). Each host gets its own card on the kiosk page.
# Choose the machines on the setup page (Hosts), or list them below.
# [[source.prometheus]]
# name = "home"                 # required: used in logs
# url = "http://prometheus.example.lan:9090"  # required
# # token_file = "prometheus-token"  # optional bearer token, for a proxy in front
# interval_s = 5                # seconds between queries
# disk_mountpoint = "/"         # filesystem shown as disk usage
# # net_device = "eth0"         # default: the busiest real network device
# hosts = [
#   # The node_exporter `instance` label alone, or a table. `name` is the shown
#   # host name (defaults to the instance without its port).
#   # With `cadvisor` (that machine's cAdvisor instance) and
#   # `expect_containers`, a container that stopped shows on the kiosk
#   # "down" list and in the `server` badge.
#   # `show = ["cpu", "memory", "updates"]` limits what the card shows (see docs/hosts.md).
#   { instance = "node-exporter:9100", name = "home", cadvisor = "cadvisor:8080", expect_containers = ["gitea", "mosquitto"] },
#   "nas.example.lan:9100",
# ]
# # Replace the PromQL of a field; it must return one value per `instance`.
# # Fields: cpu_pct, cpu_temp_c, ram_pct, disk_pct, gpu_pct, gpu_mem_pct, gpu_temp_c, uptime_s, updates, updates_security, reboot_needed.
# # GPU figures default to the NVIDIA DCGM exporter and only show when it returns data.
# # queries = { cpu_temp_c = 'max by (instance) (node_thermal_zone_temp)' }

# GitHub, GitHub Enterprise Server or GHE.com: open PRs and Actions runs, by
# polling (GitHub cannot reach your server, so no webhook). Setup is in the
# docs/install.md. Uncomment and adjust; add one block per account or instance.
# [[source.github]]
# name = "personal"             # required: used in logs
# base_url = "https://api.github.com"  # default; GHES: https://ghe.example.com/api/v3
# token_file = "github-personal" # required: read-only fine-grained token
# repos = ["your-user/repo-a"]  # required: repos to watch
# poll_s = 60                   # open PRs and recent runs, with ETags
# job_poll_s = 5                # step progress while a run is in progress
# interrupt = true              # true, false, or a list such as ["your-user/repo-a"]
# notify_new_prs = true         # flash "New PR" for new non-draft PRs
# alert_new_issues = true       # new issues in the alerts list until dismissed
# alert_finished_runs = ["pipeline.yml"]  # info alert when a push run of these workflows succeeds (off unless listed)
# # Self-hosted runners for the kiosk `runners` widget (docs/runners.md). Off unless listed.
# # Needs more token rights: repo runners "Administration: read", org runners "Self-hosted runners: read".
# # runners = ["repo:your-user/repo-a", "org:your-org"]   # do not list overlapping scopes
# # runner_poll_s = 300         # seconds between runner polls
# alias = { "your-user/repo-a" = "A" }  # short labels on the kiosk page
#
# [[source.github]]
# name = "work"
# base_url = "https://ghe.example.com/api/v3"
# token_file = "github-work"
# # Or sign in as a GitHub App installed on the organisation, not as a person
# # (docs/git-hosts.md): leave out token_file and set
# # auth = "app"
# # app_id = "123456"
# # installation_id = "7890123"
# # private_key_file = "github-work-key"   # credential holding the App's .pem text
# repos = ["team/service-a"]
# interrupt = false             # work shows only in the pipelines list, not as a banner
# alias = { "team/service-a" = "service A" }

# GitLab (gitlab.com or self-managed): open merge requests (counted as the open
# PRs) and pipelines, by polling with a read-only token. Setup and the scopes to
# grant are in docs/gitlab.md. Uncomment and adjust; add one block per instance.
# [[source.gitlab]]
# name = "personal"             # required: used in logs
# base_url = "https://gitlab.com"  # default; self-managed: https://gitlab.example.com
# token_file = "gitlab-personal" # required: read-only token (read_api)
# projects = ["your-group/project-a"]  # required: group/project or group/subgroup/project
# poll_s = 60                   # open merge requests and recent pipelines
# job_poll_s = 5                # stage progress while a pipeline is running
# interrupt = true              # true, false, or a list such as ["your-group/project-a"]
# notify_new_prs = true         # flash "New PR" for new non-draft merge requests
# alert_new_issues = true       # new issues in the alerts list until dismissed
# # Runners for the kiosk `runners` widget (docs/runners.md). Off unless listed.
# # Needs the Maintainer role (project), Owner (group) or an admin token (instance).
# # runners = ["project:your-group/project-a", "group:your-group"]  # do not list overlapping scopes
# # runner_poll_s = 300         # seconds between runner polls
# alias = { "your-group/project-a" = "A" }  # short labels on the kiosk page

# Bitbucket Cloud (bitbucket.org): open pull requests and Pipelines runs, by
# polling with a read-only access token. Setup and the rights to grant are in
# docs/bitbucket.md. Uncomment and adjust; add one block per token.
# [[source.bitbucket]]
# name = "personal"             # required: used in logs
# token_file = "bitbucket-personal" # required: read-only access token
# repos = ["your-workspace/repo-a"]  # required: workspace/repo-slug
# poll_s = 120                  # open PRs and recent pipelines (Bitbucket limits requests per hour)
# job_poll_s = 10               # step progress while a pipeline is in progress
# interrupt = true              # true, false, or a list such as ["your-workspace/repo-a"]
# notify_new_prs = true         # flash "New PR" for new non-draft PRs
# alert_new_issues = true       # new issues in the alerts list (token needs Issues: Read)
# # Self-hosted runners for the kiosk `runners` widget (docs/runners.md). Off unless listed.
# # runners = ["repo:your-workspace/repo-a", "workspace:your-workspace"]  # do not list overlapping scopes
# # runner_poll_s = 300         # seconds between runner polls
# alias = { "your-workspace/repo-a" = "A" }  # short labels on the kiosk page

# Azure DevOps Services: pipeline runs and open PRs, by polling with a read-only
# personal access token. Terraform pipelines show their stage and task
# ("apply: terraform apply"), and a stage waiting for an approval raises an
# "Approval needed" notice. Setup and the scopes to grant are in
# docs/azure-devops.md. Uncomment and adjust; add one block per organisation.
# [[source.azure_devops]]
# name = "work"                 # required: used in logs
# organization = "your-org"     # required: dev.azure.com/<organization>
# projects = ["project-a"]      # required: projects to watch
# token_file = "azdo-work"      # read-only PAT (Build: Read, Code: Read), the default way to sign in
# # Or sign in as a Microsoft Entra service principal instead of with a person's PAT
# # (docs/azure-devops-auth.md): leave out token_file and set
# # auth = "entra"
# # tenant_id = "00000000-0000-0000-0000-000000000000"
# # client_id = "00000000-0000-0000-0000-000000000000"
# # client_secret_file = "azdo-work-secret"
# poll_s = 60                   # builds, approvals and open PRs
# # container = "Work"         # Firefox only: open this source's links in that container (docs/firefox-containers.md)
# job_poll_s = 5                # step progress while a build may take over the screen
# interrupt = false             # default; true, or a list such as ["project-a"]
# pull_requests = true          # count open PRs (needs Code: Read)
# notify_new_prs = true         # flash "New PR" for new non-draft PRs
# alert_pr_comments = true      # new PR comments (not your own) in the alerts list
# deploy_words = ["deploy", "terraform"]  # pipeline names with these are deploys
# # Self-hosted agent pools for the kiosk `runners` widget (docs/runners.md). Off unless named.
# # Needs the extra token scope Agent Pools (Read).
# # agent_pools = ["Homelab"]
# # agent_poll_s = 60
# alias = { "project-a" = "infra", "project-a/repo-a" = "A" }  # short labels

