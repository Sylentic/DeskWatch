[package]
name = "deskwatch-bridge"
version.workspace = true
description = "Bridge service for the DeskWatch desk panel: collects data and publishes pages over MQTT"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.45", features = ["serde", "parsing"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# statvfs, for the disk page on Unix.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
