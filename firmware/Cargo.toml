# The DeskWatch panel firmware (ESP32-S3 SuperMini, ST7796S display).
#
# This crate is NOT part of the root workspace: it needs the Xtensa Rust
# toolchain (see README.md), which the normal `cargo test --workspace` run
# does not have. The empty [workspace] table below makes it its own root, and
# the root Cargo.toml lists the directory under `exclude`.
[workspace]

[package]
name = "deskwatch-firmware"
version = "0.9.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sylentic/DeskWatch"
# Set by the esp-hal 1.1 family (rust-version 1.88). The Xtensa toolchain is installed at
# a matching version, see README.md.
rust-version = "1.88"
publish = false

[[bin]]
name = "deskwatch-firmware"
path = "src/main.rs"
test = false
bench = false

# TLS spike (README: "TLS spike"). A separate binary that only builds with
# `--features tls-spike`, so the panel firmware never carries the TLS stack or the
# heap statistics (which cost CPU time on every allocation) until the spike has
# shown that it fits.
[[bin]]
name = "tls-spike"
path = "src/tls_spike/main.rs"
test = false
bench = false
required-features = ["tls-spike"]

[features]
tls-spike = [
    "dep:mbedtls-rs",
    "dep:tinyrlibc",
    "esp-alloc/internal-heap-stats",
]

[dependencies]
# The panel drawing code and the payload parser, shared with the simulator.
deskwatch-ui = { path = "../ui" }

esp-hal = { version = "~1.1", features = ["esp32s3", "unstable", "log-04"] }
esp-rtos = { version = "0.3", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc", "log-04"] }
esp-radio = { version = "0.18", features = ["esp32s3", "wifi", "unstable", "log-04"] }
esp-alloc = { version = "0.10", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3", "log-04"] }
esp-println = { version = "0.17", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }

embassy-executor = "0.10"
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embedded-io-async = "0.7"

rust-mqtt = { version = "0.6", default-features = false, features = ["v5", "alloc"] }

mipidsi = "0.10"
embedded-hal = "1"
embedded-hal-bus = "0.3"
embedded-graphics = "0.8.2"

# TLS spike only (feature `tls-spike`). mbedtls-rs 0.2 is the release built for the esp-hal 1.1
# family used here; 0.3 needs esp-hal 1.2. "hook-wall-clock" turns on the certificate validity
# date check (off by default in mbedtls-rs), "embassy-time" gives it a timer, "use-gcc" builds the
# changed MbedTLS configuration with the Xtensa GCC that espup installs (system clang cannot).
mbedtls-rs = { version = "0.2", optional = true, features = ["log", "hook-wall-clock", "esp32s3", "embassy-time", "use-gcc"] }
# C library functions (memchr) that the precompiled MbedTLS expects to find at link time.
tinyrlibc = { version = "0.5", optional = true, default-features = false, features = ["memchr"] }

heapless = "0.9"
log = "0.4"
static_cell = "2"

[build-dependencies]
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }

# Wi-Fi does not even connect at the default dev optimisation level, so optimise
# everything. esp-radio asks for level 3 on its own package as well.
[profile.dev]
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
overflow-checks = false
