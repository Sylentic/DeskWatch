name: Feature request
description: Something DeskWatch should do or show.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the situation first, then the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
