# Checks every pull request and every push to main:
# formatting, clippy (warnings are errors) and the test suite,
# on current stable and on the minimum supported Rust version (Linux), plus
# clippy and the tests on Windows. Linux and Windows are the supported systems.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            toolchain: stable
            lint: true
          # Keep in sync with rust-version in Cargo.toml.
          - name: msrv (1.88)
            toolchain: "1.88"
            lint: false
    steps:
      - uses: actions/checkout@v5

      # The desktop simulator (embedded-graphics-simulator) links SDL2.
      # Installing it up front lets that crate build headless on the runner.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.lint && 'rustfmt, clippy' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: cargo fmt
        if: matrix.lint
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  # The bridge and the simulator must build and pass their tests on Windows too.
  # This job is also the only proof that the bundled SDL2 build works there.
  windows:
    name: windows (stable)
    runs-on: windows-latest
    env:
      # The runner's CMake 4 refuses the old minimum-version line in SDL2's
      # CMakeLists.txt; this tells it to accept it.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      # SDL2 is built from source by the sdl2 crate (see sim/Cargo.toml), which
      # needs CMake. It is preinstalled on the runner image.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  # Builds the bridge image and starts it in demo mode. Nothing is pushed
  # anywhere; see docs/docker.md for how to publish an image.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t deskwatch-bridge:ci .

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id deskwatch-bridge:ci -u)" != 0

      # With no broker the bridge keeps retrying, so stop it after a few seconds
      # and check that it started in demo mode.
      - name: Start in demo mode
        run: |
          docker run -d --name dw deskwatch-bridge:ci --demo
          sleep 5
          docker logs dw 2>&1 | grep -q "demo mode"
          docker rm -f dw

  # Builds the bridge image for amd64 and arm64 (the Raspberry Pi) in one go.
  # arm64 runs under QEMU emulation here, so this job is slow; nothing is pushed.
  docker-multiarch:
    name: docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build for both CPUs (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
