# The one DeskWatch pipeline: checks every pull request, every push to main,
# and builds and publishes a release for every version tag (v1.2.3, v1.3.0-rc.1).
#
#   pull request, push to main:  from dev (PRs into main) + checks
#   version tag:                 checks -> version -> packages + image -> publish
#
# Branches (docs/development.md): work goes into `dev` through a pull request,
# and `main` only takes a pull request from `dev`. The "from dev" job enforces
# that; the repository's rulesets require it and the checks below.
#
# The checks: formatting, clippy (warnings are errors) and the tests on current
# stable and on the minimum supported Rust version (Linux), clippy and the tests
# on Windows, the Docker image (amd64 smoke test, and amd64 + arm64 for PRs into
# main and for releases), and the panel firmware with the Xtensa toolchain.
#
# A release: the tag must match the crate version, the binaries are built for
# Linux x86_64 and aarch64 (Ubuntu 22.04, glibc 2.35, so Debian 12 and newer)
# and Windows x86_64 (the bridge and the simulator, SDL2 linked in), each with
# a .sha256 next to it, the image goes to ghcr.io/sylentic/deskwatch-bridge,
# and the release notes are the matching section of CHANGELOG.md.
name: Pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run. A release is
# never cancelled halfway.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---- the rules ------------------------------------------------------------

  # main only takes pull requests from dev (of this repository).
  from-dev:
    name: from dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "main only takes pull requests from dev; this one comes from $HEAD_REPO:$HEAD_REF." >&2
            echo "Point the pull request at dev instead (docs/development.md)." >&2
            exit 1
          fi

  # ---- checks ---------------------------------------------------------------

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            toolchain: stable
            lint: true
          # Keep in sync with rust-version in Cargo.toml.
          - name: msrv (1.88)
            toolchain: "1.88"
            lint: false
    steps:
      - uses: actions/checkout@v5

      # The desktop simulator (embedded-graphics-simulator) links SDL2.
      # Installing it up front lets that crate build headless on the runner.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.lint && 'rustfmt, clippy' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: cargo fmt
        if: matrix.lint
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  # The bridge and the simulator must build and pass their tests on Windows too.
  # This job is also the only proof that the bundled SDL2 build works there.
  windows:
    name: windows (stable)
    runs-on: windows-latest
    env:
      # The runner's CMake 4 refuses the old minimum-version line in SDL2's
      # CMakeLists.txt; this tells it to accept it.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      # SDL2 is built from source by the sdl2 crate (see sim/Cargo.toml), which
      # needs CMake. It is preinstalled on the runner image.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  # Builds the bridge image and starts it in demo mode. Nothing is pushed.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t deskwatch-bridge:ci .

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id deskwatch-bridge:ci -u)" != 0

      # A new named volume takes the owner of /var/lib/deskwatch in the image, so
      # the bridge (uid 10001, read-only root) can write the data folder without
      # a manual chown (docs/data-dir.md).
      - name: Named volume is writable for the bridge user
        run: |
          docker volume create dwdata
          docker run --rm --read-only -v dwdata:/var/lib/deskwatch \
            --entrypoint sh deskwatch-bridge:ci -c 'touch /var/lib/deskwatch/probe'
          docker volume rm dwdata

      # With no broker the bridge keeps retrying, so stop it after a few seconds
      # and check that it started in demo mode.
      - name: Start in demo mode
        run: |
          docker run -d --name dw deskwatch-bridge:ci --demo
          sleep 5
          docker logs dw 2>&1 | grep -q "demo mode"
          docker rm -f dw

      # The dashboard-only setup: no broker, page on a published port, the fonts,
      # and the image's own health check.
      - name: Dashboard demo serves the page
        run: |
          docker run -d --name dash -p 8787:8787 \
            --health-interval 2s --health-start-period 1s \
            -e DESKWATCH_DEMO=1 -e DESKWATCH_KIOSK=1 -e DESKWATCH_NO_MQTT=1 \
            deskwatch-bridge:ci
          for i in $(seq 1 15); do curl -fs localhost:8787/ >/dev/null && break; sleep 1; done
          curl -fs localhost:8787/ | grep -qi "<html"
          curl -fs localhost:8787/api/kiosk | grep -q '"hosts"'
          curl -fsI localhost:8787/fonts/geist.woff2 | grep -qi "font/woff2"
          docker exec dash deskwatch-bridge --healthcheck
          docker logs dash 2>&1 | grep -q "MQTT is off"
          docker rm -f dash

  # The image for amd64 and arm64 (the Raspberry Pi) in one go. The Dockerfile
  # cross-compiles on the runner's own CPU instead of emulating arm64. It is the
  # slowest check, so it runs for pull requests into main only; a release builds
  # (and pushes) the same in `image`. Nothing is pushed here.
  docker-multiarch:
    name: docker image (amd64 + arm64)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build for both CPUs (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The panel firmware targets the ESP32-S3 and needs the Xtensa fork of Rust,
  # so it is outside the workspace and gets its own job. It only checks that the
  # code compiles and lints clean; nothing here runs on a board. Not needed for
  # a release (the firmware is not released).
  firmware:
    name: firmware (esp32s3)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5

      # Installs the "esp" toolchain (rust-toolchain.toml in firmware/ selects
      # it) and the Xtensa GCC the linker needs.
      - uses: esp-rs/xtensa-toolchain@v1.6
        # espup asks the GitHub API for the latest Xtensa Rust release.
        # Without a token that call is rate limited and fails with a 403.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildtargets: esp32s3
          ldproxy: false

      # The mbedtls build (CMake) caches the full path of the Xtensa GCC in the
      # target directory. espup moves to a new GCC folder whenever Espressif
      # releases one, and a restored cache then points at a compiler that no
      # longer exists. rust-cache only keys on the Rust version, so put the GCC
      # folder name in the cache key.
      - name: Find the Xtensa GCC version
        id: gcc
        run: echo "version=$(ls "$HOME/.rustup/toolchains/esp/xtensa-esp-elf" | sort | tail -n1)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
          key: firmware-${{ steps.gcc.outputs.version }}

      # Formatting does not need the Xtensa compiler, stable rustfmt is enough.
      - name: cargo fmt
        run: cargo +stable fmt --check

      - name: cargo clippy
        run: cargo clippy --release --locked -- -D warnings

      # The TLS spike is a second binary behind a cargo feature (see
      # firmware/README.md). Linting it needs the TLS stack, which is only
      # compiled with the feature on.
      - name: cargo clippy (tls-spike)
        run: cargo clippy --release --locked --features tls-spike -- -D warnings

      # Falls back to config.example.toml, since config.toml is gitignored.
      - name: cargo build
        run: cargo build --release --locked

      # MbedTLS is compiled from source here, with the Xtensa GCC from the
      # toolchain step. The runner already has cmake and ninja.
      - name: cargo build (tls-spike)
        run: cargo build --release --locked --features tls-spike --bin tls-spike

  # ---- release (version tags only) -------------------------------------------

  # The tag must match the crate version, so a mistyped tag, or a tag on a
  # commit from before the release PR, cannot ship a binary that reports
  # another version.
  version:
    name: release version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deskwatch-bridge") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match deskwatch-bridge $crate" >&2
            echo "The tag points at $(git rev-parse --short HEAD), which has version $crate." >&2
            echo "Tag the merge commit of the release PR on main (git pull first), see docs/releasing.md." >&2
            exit 1
          fi

  # One job per platform; the tests already ran in `check` and `windows`.
  package-linux:
    name: package (${{ matrix.arch }}-linux)
    needs: [version, check, windows, docker]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build
        run: cargo build -p deskwatch-bridge --release --locked

      - name: Package
        run: |
          name="deskwatch-bridge-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp target/release/deskwatch-bridge "dist/$name/"
          cp -r bridge/config.example.toml deploy homeassistant docs README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE "dist/$name/"
          strip "dist/$name/deskwatch-bridge"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  package-windows:
    name: package (x86_64-windows)
    needs: [version, check, windows, docker]
    runs-on: windows-latest
    env:
      # CMake 4 refuses the old minimum-version line in SDL2's CMakeLists.txt.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      # The bridge and the simulator (SDL2 is built from source and linked in).
      - name: Build
        run: cargo build -p deskwatch-bridge -p deskwatch-sim --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $name = "deskwatch-$tag-x86_64-windows"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $bin = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$bin/deskwatch-bridge.exe", "$bin/deskwatch-sim.exe" $dir
          Copy-Item -Recurse bridge/config.example.toml, deploy, homeassistant, docs, README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          # Same "<hash>  <file>" layout that sha256sum -c reads.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"
          Remove-Item -Recurse $dir

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The bridge image for GitHub's registry: ghcr.io/sylentic/deskwatch-bridge.
  # Tags: the version without the "v" (1.0.0) and, for tags without a suffix
  # such as -rc.1, `latest`. amd64 and arm64 in one manifest.
  image:
    name: publish image
    needs: [version, check, docker]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sylentic/deskwatch-bridge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish release
    needs: [package-linux, package-windows, image]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Release notes: the CHANGELOG section for this version.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x tags and tags with a suffix such as -rc.1 are pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "DeskWatch ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sha256
