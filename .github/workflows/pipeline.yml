# The one DeskWatch pipeline: checks every pull request, every push to main,
# and builds and publishes a release for every version tag (v1.2.3, v1.3.0-rc.1).
#
#   pull request:                from dev (PRs into main) + checks
#   push to dev (a merge):       checks -> dev image (ghcr.io/...:dev, to try it)
#   push to main (dev -> main):  checks -> version: a new version in Cargo.toml
#                                is tagged and released -> packages + image -> publish
#   version tag pushed by hand:  the same release, for that tag
#
# Branches (docs/development.md): work goes into `dev` through a pull request,
# and `main` only takes a pull request from `dev`. The "from dev" job enforces
# that; the repository's rulesets require it and the checks below.
#
# The checks: formatting, clippy (warnings are errors) and the tests on current
# stable and on the minimum supported Rust version (Linux), clippy and the tests
# on Windows, the Docker image (amd64 smoke test, and amd64 + arm64 for PRs into
# main and for releases).
#
# A release: the tag must match the crate version, the binaries are built for
# Linux x86_64 and aarch64 (Ubuntu 22.04, glibc 2.35, so Debian 12 and newer)
# and Windows x86_64, each with
# a .sha256 next to it, the image goes to ghcr.io/sylentic/deskwatch-bridge,
# and the release notes are the matching section of CHANGELOG.md.
name: Pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run. A release is
# never cancelled halfway.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debug info in the check builds: faster compiles and links (most of all
  # on Windows) and smaller caches. Release builds use their own profile.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # ---- the rules ------------------------------------------------------------

  # main only takes pull requests from dev (of this repository).
  from-dev:
    name: from dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "main only takes pull requests from dev; this one comes from $HEAD_REPO:$HEAD_REF." >&2
            echo "Point the pull request at dev instead (docs/development.md)." >&2
            exit 1
          fi

  # ---- checks ---------------------------------------------------------------

  # A pull request into dev that only touches Markdown files (docs, changelog,
  # templates) skips the Rust and Docker work below. The jobs still run and
  # report, with every step skipped, so the required checks keep their names
  # and turn green. Everything else (pushes, tags, pull requests into main)
  # always runs in full, and so does a pull request when anything is unclear.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Does the pull request change anything but Markdown?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "dev" ]; then
            if files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" \
               && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::Rust and Docker checks needed: $code"

  check:
    name: ${{ matrix.name }}
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            toolchain: stable
            lint: true
          # Keep in sync with rust-version in Cargo.toml.
          - name: msrv (1.88)
            toolchain: "1.88"
            lint: false
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.code == 'true'
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.lint && 'rustfmt, clippy' || '' }}

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          key: ${{ matrix.toolchain }}

      - name: cargo fmt
        if: needs.changes.outputs.code == 'true' && matrix.lint
        run: cargo fmt --all --check

      - name: cargo clippy
        if: needs.changes.outputs.code == 'true' && matrix.lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked

      - name: Markdown only, nothing to check
        if: needs.changes.outputs.code != 'true'
        run: echo "Only Markdown files changed."

  # The bridge must build and pass its tests on Windows too.
  windows:
    name: windows (stable)
    needs: [changes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          key: windows

      - name: cargo clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked

      - name: Markdown only, nothing to check
        if: needs.changes.outputs.code != 'true'
        run: echo "Only Markdown files changed."

  # Builds the bridge image and starts it in demo mode. Nothing is pushed. The
  # build keeps its layers in the GitHub cache, so the compiled dependencies are
  # reused until Cargo.toml or Cargo.lock changes.
  docker:
    name: docker image
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.code == 'true'

      - name: Build the image
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: deskwatch-bridge:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Runs as a non-root user
        if: needs.changes.outputs.code == 'true'
        run: test "$(docker run --rm --entrypoint id deskwatch-bridge:ci -u)" != 0

      # A new named volume takes the owner of /var/lib/deskwatch in the image, so
      # the bridge (uid 10001, read-only root) can write the data folder without
      # a manual chown (docs/data-dir.md).
      - name: Named volume is writable for the bridge user
        if: needs.changes.outputs.code == 'true'
        run: |
          docker volume create dwdata
          docker run --rm --read-only -v dwdata:/var/lib/deskwatch \
            --entrypoint sh deskwatch-bridge:ci -c 'touch /var/lib/deskwatch/probe'
          docker volume rm dwdata

      # With no broker the bridge keeps retrying, so stop it after a few seconds
      # and check that it started in demo mode.
      - name: Start in demo mode
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run -d --name dw deskwatch-bridge:ci --demo
          sleep 5
          docker logs dw 2>&1 | grep -q "demo mode"
          docker rm -f dw

      # The dashboard-only setup: no broker, page on a published port, the fonts,
      # and the image's own health check.
      - name: Dashboard demo serves the page
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run -d --name dash -p 8787:8787 \
            --health-interval 2s --health-start-period 1s \
            -e DESKWATCH_DEMO=1 -e DESKWATCH_KIOSK=1 -e DESKWATCH_NO_MQTT=1 \
            deskwatch-bridge:ci
          for i in $(seq 1 15); do curl -fs localhost:8787/ >/dev/null && break; sleep 1; done
          curl -fs localhost:8787/ | grep -qi "<html"
          curl -fs localhost:8787/api/kiosk | grep -q '"hosts"'
          curl -fsI localhost:8787/fonts/geist.woff2 | grep -qi "font/woff2"
          docker exec dash deskwatch-bridge --healthcheck
          docker logs dash 2>&1 | grep -q "MQTT is off"
          docker rm -f dash

      - name: Markdown only, nothing to check
        if: needs.changes.outputs.code != 'true'
        run: echo "Only Markdown files changed."

  # The image for amd64 and arm64 (the Raspberry Pi) in one go. The Dockerfile
  # cross-compiles on the runner's own CPU instead of emulating arm64. It is the
  # slowest check, so it runs for pull requests into main only; a release builds
  # (and pushes) the same in `image`. Nothing is pushed here.
  docker-multiarch:
    name: docker image (amd64 + arm64)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build for both CPUs (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- release (a merge into main with a new version, or a version tag) --------

  # Decides whether this run releases, and which tag:
  # - a push to main (the dev -> main merge): the crate version is the release.
  #   When the tag v<version> does not exist yet, this job creates it on the
  #   merged commit and the release runs right here (a tag pushed by the
  #   pipeline's own token starts no new run). When it exists, nothing is
  #   released: main got changes without a version bump.
  # - a version tag pushed by hand: it must match the crate version, so a
  #   mistyped tag, or one on a commit from before the release, cannot ship a
  #   binary that reports another version.
  # It runs after the checks, so a red main is never tagged.
  version:
    name: release version
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [check, windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the release
        id: decide
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deskwatch-bridge") | .version')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
              echo "tag $GITHUB_REF_NAME does not match deskwatch-bridge $crate" >&2
              echo "The tag points at $(git rev-parse --short HEAD), which has version $crate." >&2
              echo "Releases happen on the merge into main by themselves, see docs/releasing.md." >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="v$crate"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::notice::$tag already exists: no release (bump the version in Cargo.toml to release)."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "::notice::Tagged $tag on $(git rev-parse --short "$GITHUB_SHA"); releasing it."
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # One job per platform; the tests already ran in `check` and `windows`.
  package-linux:
    name: package (${{ matrix.arch }}-linux)
    needs: [version]
    if: needs.version.outputs.release == 'true'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build
        run: cargo build -p deskwatch-bridge --release --locked

      - name: Package
        run: |
          name="deskwatch-bridge-${TAG}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp target/release/deskwatch-bridge "dist/$name/"
          cp -r bridge/config.example.toml deploy homeassistant docs README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE "dist/$name/"
          strip "dist/$name/deskwatch-bridge"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  package-windows:
    name: package (x86_64-windows)
    needs: [version]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Build
        run: cargo build -p deskwatch-bridge --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:TAG
          $name = "deskwatch-$tag-x86_64-windows"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $bin = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$bin/deskwatch-bridge.exe" $dir
          Copy-Item -Recurse bridge/config.example.toml, deploy, homeassistant, docs, README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          # Same "<hash>  <file>" layout that sha256sum -c reads.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"
          Remove-Item -Recurse $dir

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The bridge image for GitHub's registry: ghcr.io/sylentic/deskwatch-bridge.
  # Tags: the version without the "v" (1.0.0) and, for tags without a suffix
  # such as -rc.1, `latest`. amd64 and arm64 in one manifest.
  image:
    name: publish image
    needs: [version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sylentic/deskwatch-bridge
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.tag, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- the dev image (pushes to dev only) --------------------------------------

  # What is on dev, as an image to try before it is released:
  # ghcr.io/sylentic/deskwatch-bridge:dev (always the newest merge) and
  # :dev-<short commit> (to go back to one). Never `latest` or a version tag, so
  # a server that pins a release does not change. It starts at once, next to the
  # checks, instead of after them: dev only gets changes through a pull request
  # whose checks already passed, and this saves the wait.
  dev-image:
    name: publish dev image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sylentic/deskwatch-bridge
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: DESKWATCH_DEV_BUILD=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish release
    needs: [version, package-linux, package-windows, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Release notes: the CHANGELOG section for this version.
      - name: Extract release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          # Fixed closing line on every release.
          printf '\n---\n\nSomething not working? [Open an issue](https://github.com/%s/issues/new/choose).\n' \
            "$GITHUB_REPOSITORY" >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x tags and tags with a suffix such as -rc.1 are pre-releases.
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease --verify-tag \
            --title "DeskWatch ${TAG}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sha256
