# Builds DeskWatch for Linux x86_64, Linux aarch64 (64-bit Raspberry Pi OS) and
# Windows x86_64 and attaches all of them to a GitHub release when a version tag (v0.9.0, v1.2.3, ...) is pushed. Nothing
# here runs on branches or pull requests. The release notes are the matching
# section of CHANGELOG.md.
#
# The Linux binary is built on Ubuntu 22.04 (glibc 2.35) so it also runs on
# Debian 12 and newer. It links only libc, libm and libgcc, nothing else to
# install. The aarch64 binary is built the same way, natively, on GitHub's
# Ubuntu 22.04 arm64 runner, so it also runs on 64-bit Raspberry Pi OS (Debian
# 12 and newer). The Windows zip holds the bridge and the desktop simulator, built
# for x86_64-pc-windows-msvc (SDL2 is linked into the simulator, no DLLs).
# Each archive has a .sha256 file next to it.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag must match the crate version, so a mistyped tag cannot ship a
      # binary that reports another version.
      - name: Check the tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deskwatch-bridge") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match deskwatch-bridge $crate" >&2
            exit 1
          fi

      - name: Test the bridge
        run: cargo test -p deskwatch-bridge --locked

      - name: Build
        run: cargo build -p deskwatch-bridge --release --locked

      - name: Package
        run: |
          name="deskwatch-bridge-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/deskwatch-bridge "dist/$name/"
          cp -r bridge/config.example.toml deploy homeassistant docs README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE "dist/$name/"
          strip "dist/$name/deskwatch-bridge"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64

      # The tag must match the crate version, so a mistyped tag cannot ship a
      # binary that reports another version.
      - name: Check the tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deskwatch-bridge") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match deskwatch-bridge $crate" >&2
            exit 1
          fi

      - name: Test the bridge
        run: cargo test -p deskwatch-bridge --locked

      - name: Build
        run: cargo build -p deskwatch-bridge --release --locked

      - name: Package
        run: |
          name="deskwatch-bridge-${GITHUB_REF_NAME}-aarch64-linux"
          mkdir -p "dist/$name"
          cp target/release/deskwatch-bridge "dist/$name/"
          cp -r bridge/config.example.toml deploy homeassistant docs README.md CHANGELOG.md \
            LICENSE-MIT LICENSE-APACHE "dist/$name/"
          strip "dist/$name/deskwatch-bridge"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      # CMake 4 refuses the old minimum-version line in SDL2's CMakeLists.txt.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Test
        run: cargo test --workspace --locked

      # The bridge and the simulator (SDL2 is built from source and linked in).
      - name: Build
        run: cargo build -p deskwatch-bridge -p deskwatch-sim --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $name = "deskwatch-$tag-x86_64-windows"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $bin = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$bin/deskwatch-bridge.exe", "$bin/deskwatch-sim.exe" $dir
          Copy-Item -Recurse bridge/config.example.toml, deploy, homeassistant, docs, README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          # Same "<hash>  <file>" layout that sha256sum -c reads.
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"
          Remove-Item -Recurse $dir

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The bridge image for GitHub's registry: ghcr.io/sylentic/deskwatch-bridge.
  # Tags: the version without the "v" (0.9.9) and, for tags without a suffix such
  # as -rc.1, `latest`. amd64 and arm64 (Raspberry Pi) in one manifest; the
  # Dockerfile cross-compiles on the runner's own CPU instead of emulating.
  # A new package is private until it is made public in the package settings.
  docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The tag must match the crate version, as for the binaries above.
      - name: Check the tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "deskwatch-bridge") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match deskwatch-bridge $crate" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sylentic/deskwatch-bridge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [linux, linux-arm64, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Release notes: the CHANGELOG section for this version.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x tags (before 1.0) and tags with a suffix such as -rc.1 are pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "DeskWatch ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sha256
