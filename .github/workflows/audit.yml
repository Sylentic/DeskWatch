# Checks Cargo.lock against the RustSec advisory database. It runs when the
# lockfile changes (so also on every Dependabot pull request) and once a week,
# because a lock that did not change can still become vulnerable. It is not a
# required check: a new advisory should not block unrelated work.
name: Audit

on:
  pull_request:
    branches: [dev, main]
    paths: [Cargo.lock]
  push:
    branches: [dev]
    paths: [Cargo.lock]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rumqttc 0.25.1 (the newest) depends on rustls-webpki 0.102.8 only
          # for the name of an error type; the real certificate checks of the
          # MQTT connection run on rustls-webpki 0.103.x, which has these
          # fixes. Remove this ignore list when a rumqttc release
          # moves to a newer rustls-webpki.
          ignore: RUSTSEC-2026-0049,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0104,RUSTSEC-2026-0382
